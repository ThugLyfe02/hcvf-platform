repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: alembic-graph
        name: alembic revision graph must have exactly one head
        entry: python scripts/check_alembic_graph.py
        language: system
        pass_filenames: false
      - id: engine-tests
        name: engine unit tests
        entry: python -m unittest discover -s tests/unit -t .
        language: system
        pass_filenames: false

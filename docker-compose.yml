services:
  postgres:
    image: postgres:16-alpine
    container_name: hcvf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hcvf
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hcvf
    ports:
      # Bound to loopback: publishing a database with a default password on
      # every interface is a compromise waiting for a shared host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcvf -d hcvf"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: hcvf-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    container_name: hcvf-api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &hcvf-env
      DATABASE_URL: postgresql+psycopg://hcvf:password@postgres:5432/hcvf
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      API_KEY_HEADER: X-API-Key
      HCVF_API_KEYS: dev-hcvf-key
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      SCHEDULER_INTERVAL_SECONDS: "5"
      HUNT_BUDGET_REQUESTS: "200"
      HUNT_MAX_RPS: "5"
      HUNT_LEASE_SECONDS: "600"
      EVIDENCE_DIR: /app/evidence
      EVIDENCE_KEY: development-only-change-me
      ALLOW_PRIVATE_TARGETS: "false"
      AUTONOMY_ENABLED: "true"
      AUTONOMY_INTERVAL_SECONDS: "60"
      MAX_REQUEST_BYTES: "1048576"
      LOG_REDACTION: "true"
      QUOTA_ENFORCED: "true"
      WEBHOOK_TIMEOUT_SECONDS: "5"
    volumes:
      - evidence_data:/app/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    container_name: hcvf-worker
    restart: unless-stopped
    command: celery -A worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *hcvf-env
    volumes:
      - evidence_data:/app/evidence
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    build: .
    container_name: hcvf-scheduler
    restart: unless-stopped
    command: python -m worker.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *hcvf-env
    volumes:
      - evidence_data:/app/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); raise SystemExit(0 if r.ping() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  agents:
    build: .
    container_name: hcvf-agents
    restart: unless-stopped
    command: python -m worker.agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *hcvf-env
    volumes:
      - evidence_data:/app/evidence
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          from datetime import UTC, datetime, timedelta
          from sqlalchemy import func, select
          from app.db.session import SessionLocal
          from app.models import AgentHeartbeat
          db = SessionLocal()
          fresh = db.scalar(
              select(func.count()).select_from(AgentHeartbeat).where(
                  AgentHeartbeat.last_seen_at >= datetime.now(UTC) - timedelta(seconds=120)
              )
          )
          raise SystemExit(0 if fresh else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    name: hcvf-postgres-data
  redis_data:
    name: hcvf-redis-data
  evidence_data:
    name: hcvf-evidence-data

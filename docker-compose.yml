services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hcvf
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hcvf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcvf -d hcvf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &hcvf-env
      DATABASE_URL: postgresql+psycopg://hcvf:password@postgres:5432/hcvf
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      API_KEY_HEADER: X-API-Key
      HCVF_API_KEYS: dev-hcvf-key
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"

  worker:
    build: .
    command: celery -A worker.celery_app:celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *hcvf-env

  scheduler:
    build: .
    command: python -m worker.scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *hcvf-env

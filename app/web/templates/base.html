<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HCVF Console{% endblock %}</title>
  <link rel="stylesheet" href="/console/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/console">
    <span class="brand-mark">HCVF</span>
    <span class="brand-sub">validation console</span>
  </a>
  <nav class="nav">
    {% for item in nav %}
      <a href="{{ item.href }}" class="nav-link {% if active == item.href or (item.href != '/console' and active.startswith(item.href)) %}active{% endif %}">{{ item.label }}</a>
    {% endfor %}
  </nav>
  <div class="topbar-right">
    {% if tenant %}<span class="tenant-pill" title="tenant">{{ tenant.name }}</span>{% endif %}
    <button class="icon-btn" id="theme-toggle" title="Toggle theme">◐</button>
    <form method="post" action="/console/logout"><button class="icon-btn" title="Sign out">⏻</button></form>
  </div>
</header>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>HCVF - authorized validation only</span>
  <span class="muted">All actions are tenant-scoped and audited.</span>
</footer>
<script src="/console/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>

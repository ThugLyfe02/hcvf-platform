<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - HCVF Console</title>
  <link rel="stylesheet" href="/console/static/app.css">
</head>
<body class="login-body">
<form class="login-card" method="post" action="/console/login">
  <div class="brand-mark large">HCVF</div>
  <h1>Operator console</h1>
  <p class="muted">Paste a tenant API key. The key is exchanged for a signed, HttpOnly session cookie; it is never stored in the browser.</p>
  {% if request.query_params.get('error') %}<div class="alert error">{{ request.query_params.get('error') }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ request.query_params.get('next', '/console') }}">
  <label for="api_key">API key</label>
  <input id="api_key" name="api_key" type="password" autocomplete="off" placeholder="tenant api key" required autofocus>
  <button class="btn primary" type="submit">Open console</button>
</form>
</body>
</html>
